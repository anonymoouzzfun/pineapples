<!DOCTYPE html>
<html>
<head>
<title>pineapples</title>
<style>
body {
background: cyan;
margin: 0;
height: 100vh;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
overflow: hidden;
cursor: pointer;
}
.p {
font-size: 150px;
animation: sh 0.1s infinite;
user-select: none;
}
@keyframes sh {
0% { transform: translate(3px, 1px) rotate(0deg); }
25% { transform: translate(-2px, -2px) rotate(-3deg); }
50% { transform: translate(1px, 3px) rotate(3deg); }
75% { transform: translate(-3px, 0px) rotate(-1deg); }
100% { transform: translate(2px, -1px) rotate(2deg); }
}
.b {
width: 80%;
max-width: 500px;
height: 25px;
background: #008888;
border: 3px solid #004444;
margin-top: 60px;
}
.f {
width: 0%;
height: 100%;
background: yellow;
}
</style>
</head>
<body>

<div class="p">🍍</div>
<div class="b"><div class="f" id="f"></div></div>
<audio id="a" src="pineapples.mp3" loop></audio>

<script>
let a = document.getElementById('a')
let f = document.getElementById('f')
let c = false

document.body.onclick = () => {
if(!c) {
a.play()
c = true
}
}

let s = Date.now()
let d = 3600000

setInterval(() => {
let p = ((Date.now() - s) / d) * 100
if (p >= 100) {
window.location.href = 'https://discord.gg/c00lkiddtechv2'
}
f.style.width = p + '%'
}, 1000)
</script>
</body>
</html>
