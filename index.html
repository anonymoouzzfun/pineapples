<!DOCTYPE html>
<html>
<head>
<title>pineapple</title>
<style>
body {
    background-color: cyan;
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.pineapple {
    font-size: 150px;
    animation: shake 0.1s infinite;
    user-select: none;
}

@keyframes shake {
    0% { transform: translate(3px, 1px) rotate(0deg); }
    25% { transform: translate(-2px, -2px) rotate(-3deg); }
    50% { transform: translate(1px, 3px) rotate(3deg); }
    75% { transform: translate(-3px, 0px) rotate(-1deg); }
    100% { transform: translate(2px, -1px) rotate(2deg); }
}

.bar-bg {
    width: 90%;
    max-width: 500px;
    height: 20px;
    background: #00aaaa;
    border: 2px solid #005555;
    margin-top: 80px;
    overflow: hidden;
}

.bar-fill {
    width: 0%;
    height: 100%;
    background: #ffff00;
}
</style>
</head>
<body>

<div class="pineapple">🍍</div>

<div class="bar-bg">
    <div class="bar-fill" id="fill"></div>
</div>

<audio id="bgm" src="pineapples.mp3" loop autoplay></audio>

<script>
const fill = document.getElementById('fill');
const bgm = document.getElementById('bgm');

bgm.play().catch(() => {});

const duration = 3600 * 1000;
const start = Date.now();

const tick = setInterval(() => {
    let elapsed = Date.now() - start;
    let p = (elapsed / duration) * 100;
    
    if (p >= 100) {
        p = 100;
        clearInterval(tick);
        window.location.href = 'https://discord.gg/c00lkiddtechv2';
    }
    
    fill.style.width = p + '%';
}, 1000);
</script>

</body>
</html>
